<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="One indicator traced end to end: NASA POWER daily highest temperatures become a count of very hot days per season, which the season summary shows with its caveats. No decision engine rule reads it.">
  <title>From a NASA observation to the number on screen</title>
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#16201a" text-anchor="start">One indicator, from a NASA observation to the number on screen</text>
  <text x="24" y="56" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b665f" text-anchor="start">Very hot days: how it is made, where it is shown, and what does not read it.</text>
  <rect x="24" y="96" width="210" height="156" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="129.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">NASA POWER weather</text>
  <text x="129.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">daily highest and lowest</text>
  <text x="129.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">air temperature,</text>
  <text x="129.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">grid cell about 50 km</text>
  <text x="129.0" y="240" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">Evidence: model estimate</text>
  <rect x="318" y="96" width="210" height="156" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="423.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Very hot days</text>
  <text x="423.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">per season, Apr to Nov</text>
  <text x="423.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">days at 30 °C or more</text>
  <text x="423.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">unknown if &lt; 90 % of days</text>
  <text x="423.0" y="240" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">Evidence: derived</text>
  <rect x="612" y="96" width="210" height="156" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="717.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Highest and lowest season</text>
  <text x="717.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">the 11 seasons compared</text>
  <text x="717.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">never added into a score</text>
  <text x="717.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">unknown seasons left out</text>
  <text x="717.0" y="240" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">season summary</text>
  <line x1="234" y1="166" x2="311" y2="166" stroke="#16201a" stroke-width="2"/><polygon points="318,166 309,161 309,171" fill="#16201a"/>
  <text x="276.0" y="158" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">per season</text>
  <line x1="528" y1="166" x2="605" y2="166" stroke="#16201a" stroke-width="2"/><polygon points="612,166 603,161 603,171" fill="#16201a"/>
  <text x="570.0" y="158" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">compare</text>
  <rect x="906" y="84" width="350" height="292" rx="10" fill="#ffffff" stroke="#235032" stroke-width="2"/>
  <text x="1081.0" y="108" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Who reads it</text>
  <text x="1081.0" y="126" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b665f" text-anchor="middle">and what each does with it</text>
  <text x="922" y="156" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#3b463f" text-anchor="start">the season summary screen</text>
  <rect x="922" y="164" width="318" height="26" rx="7" fill="#e1eddf" stroke="#235032" stroke-width="1.5"/>
  <text x="934" y="182" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#235032" text-anchor="start">Shown, with its caveats</text>
  <text x="922" y="212" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#3b463f" text-anchor="start">a season with too little data</text>
  <rect x="922" y="220" width="318" height="26" rx="7" fill="#f6ebcd" stroke="#8a5d0f" stroke-width="1.5"/>
  <text x="934" y="238" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8a5d0f" text-anchor="start">Shown as unknown, never zero</text>
  <text x="922" y="268" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#3b463f" text-anchor="start">the decision engine&#x27;s rules</text>
  <rect x="922" y="276" width="318" height="26" rx="7" fill="#f4e2d9" stroke="#8f432a" stroke-width="1.5"/>
  <text x="934" y="294" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8f432a" text-anchor="start">No rule reads it</text>
  <text x="922" y="324" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#3b463f" text-anchor="start">the outcome banner</text>
  <rect x="922" y="332" width="318" height="26" rx="7" fill="#f4e2d9" stroke="#8f432a" stroke-width="1.5"/>
  <text x="934" y="350" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8f432a" text-anchor="start">Not changed by it</text>
  <line x1="822" y1="166" x2="899" y2="166" stroke="#16201a" stroke-width="2"/><polygon points="906,166 897,161 897,171" fill="#16201a"/>
  <text x="864.0" y="158" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">shown by</text>
  <rect x="24" y="292" width="798" height="92" rx="10" fill="#faf9f4" stroke="#bdb9a6" stroke-width="1"/>
  <text x="44" y="318" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#16201a" text-anchor="start">On screen</text>
  <text x="44" y="340" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">The compare page shows hot days per season and the highest and lowest season, and says what it counts.</text>
  <text x="44" y="360" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">Every number opens &quot;Where this comes from&quot;: source, grid scale, what is missing, and the lineage record.</text>
  <line x1="906" y1="338" x2="829" y2="338" stroke="#16201a" stroke-width="2"/><polygon points="822,338 831,333 831,343" fill="#16201a"/>
  <text x="864.0" y="330" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">caveats</text>
  <rect x="24" y="410" width="1232" height="128" rx="10" fill="#faf9f4" stroke="#bdb9a6" stroke-width="1"/>
  <text x="44" y="436" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#16201a" text-anchor="start">What to be honest about</text>
  <text x="44" y="460" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">•  The 30 °C line is a team proposal that no agronomist has reviewed. It counts whole seasons and says nothing about crop stage.</text>
  <text x="44" y="480" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">•  POWER is a model on a 50 km grid, not a weather station. Against the Iowa station it ran about 11 % low on rainfall.</text>
  <text x="44" y="500" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">•  A climate rule built on growing degree days was withdrawn on 2026-11-15: its band had no published basis and could never fire.</text>
  <text x="44" y="520" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">•  Missing data is never read as good news: an unknown season is left out, never counted as zero.</text>
</svg>
