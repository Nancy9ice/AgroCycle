  <line x1="364" y1="185" x2="397" y2="185" stroke="#16201a" stroke-width="2"/><polygon points="404,185 395,180 395,190" fill="#16201a"/>
  <text x="489" y="250" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#3b463f" text-anchor="middle">calls the API from the server;</text>
  <text x="489" y="265" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#3b463f" text-anchor="middle">the browser never does</text>
