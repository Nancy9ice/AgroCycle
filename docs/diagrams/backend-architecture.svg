<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-label="A farmer&#x27;s browser reaches Traefik, which serves the Next.js web app and the FastAPI API. The web app calls the API from its server. The API has routes, core logic, a pure decision engine and a data access layer. The data access layer reads and writes ClickHouse, reads aerial photos from S3 and calls Claude for the AI explanation. Separately, data pipelines run by the data team bring NASA and USDA data into S3 and ClickHouse.">
  <title>AgroCycle backend, system architecture</title>
  <rect width="1280" height="660" fill="#ffffff"/>
  <text x="24" y="34" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#16201a" text-anchor="start">AgroCycle backend: system architecture</text>
  <text x="24" y="56" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b665f" text-anchor="start">Solid green: our code.  Grey: an external service.  Amber: run by a person, outside the API.</text>
  <rect x="24" y="150" width="150" height="70" rx="8" fill="#efede3" stroke="#5b665f" stroke-width="1.6"/>
  <text x="99.0" y="170" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#16201a" text-anchor="middle">Browser</text>
  <text x="99.0" y="188.0" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3b463f" text-anchor="middle">the farmer or</text>
  <text x="99.0" y="202.5" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3b463f" text-anchor="middle">an adviser</text>
  <rect x="214" y="150" width="150" height="70" rx="8" fill="#efede3" stroke="#5b665f" stroke-width="1.6"/>
  <text x="289.0" y="170" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#16201a" text-anchor="middle">Traefik</text>
  <text x="289.0" y="188.0" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3b463f" text-anchor="middle">HTTPS and routing</text>
  <rect x="404" y="150" width="170" height="70" rx="8" fill="#e1eddf" stroke="#235032" stroke-width="1.6"/>
  <text x="489.0" y="170" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#16201a" text-anchor="middle">Web app</text>
  <text x="489.0" y="188.0" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3b463f" text-anchor="middle">Next.js, server-side</text>
