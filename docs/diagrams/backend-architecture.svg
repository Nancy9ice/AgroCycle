  <text x="1133.0" y="142.5" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3b463f" text-anchor="middle">saved comparisons, feedback</text>
  <text x="1133.0" y="157.0" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3b463f" text-anchor="middle">and drawn boundaries</text>
