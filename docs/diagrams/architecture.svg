<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Data flows left to right from NASA and USDA sources through ingest, S3, transform and ClickHouse to the API and the web app. Everything on the main path is built; the greenness features, the Marsden load and three endpoints are not.">
  <title>AgroCycle architecture</title>
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#16201a" text-anchor="start">Where the data goes, and what is built</text>
  <text x="24" y="56" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b665f" text-anchor="start">Solid green: built and tested.  Amber: built, not fully exercised.  Dashed red: not built.</text>
  <rect x="24" y="96" width="130" height="150" rx="10" fill="#efede3" stroke="#5b665f" stroke-width="2"/>
  <text x="89.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Sources</text>
  <text x="89.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">NASA POWER, HLS</text>
  <text x="89.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">USDA CDL, SSURGO</text>
  <text x="89.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">Marsden paper data</text>
  <text x="89.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#5b665f" text-anchor="middle">External</text>
  <rect x="206" y="96" width="130" height="150" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="271.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">ingest/</text>
  <text x="271.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">Python job per</text>
  <text x="271.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">source, with a</text>
  <text x="271.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">checksum manifest</text>
  <text x="271.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">Built</text>
  <rect x="388" y="96" width="130" height="150" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="453.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">S3 raw</text>
  <text x="453.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">never edited</text>
  <text x="453.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">738 files, plus</text>
  <text x="453.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">HLS (210 MB)</text>
  <text x="453.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">Built</text>
  <rect x="570" y="96" width="130" height="150" rx="10" fill="#f6ebcd" stroke="#8a5d0f" stroke-width="2"/>
  <text x="635.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">transform/</text>
  <text x="635.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">clean, indicators,</text>
  <text x="635.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">crop-history rules</text>
  <text x="635.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">(no HLS features)</text>
  <text x="635.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5d0f" text-anchor="middle">Partly built</text>
  <rect x="752" y="96" width="130" height="150" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="817.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">ClickHouse</text>
  <text x="817.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">curated tables,</text>
  <text x="817.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">indicator lineage,</text>
  <text x="817.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">crop history</text>
  <text x="817.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">Built</text>
  <rect x="934" y="96" width="130" height="150" rx="10" fill="#f6ebcd" stroke="#8a5d0f" stroke-width="2"/>
  <text x="999.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">FastAPI</text>
  <text x="999.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">profile, compare,</text>
  <text x="999.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">with the decision</text>
  <text x="999.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">engine inside</text>
  <text x="999.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5d0f" text-anchor="middle">Not run on live DB</text>
  <rect x="1116" y="96" width="130" height="150" rx="10" fill="#e1eddf" stroke="#235032" stroke-width="2"/>
  <text x="1181.0" y="124" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Web app</text>
  <text x="1181.0" y="146" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">map, profile,</text>
  <text x="1181.0" y="162" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">comparison,</text>
  <text x="1181.0" y="178" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">adviser brief</text>
  <text x="1181.0" y="234" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#235032" text-anchor="middle">Built</text>
  <line x1="154" y1="158" x2="199" y2="158" stroke="#16201a" stroke-width="2"/><polygon points="206,158 197,153 197,163" fill="#16201a"/>
  <text x="180.0" y="150" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">pull</text>
  <line x1="336" y1="158" x2="381" y2="158" stroke="#16201a" stroke-width="2"/><polygon points="388,158 379,153 379,163" fill="#16201a"/>
  <text x="362.0" y="150" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">upload</text>
  <line x1="518" y1="158" x2="563" y2="158" stroke="#16201a" stroke-width="2"/><polygon points="570,158 561,153 561,163" fill="#16201a"/>
  <text x="544.0" y="150" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">clean</text>
  <line x1="700" y1="158" x2="745" y2="158" stroke="#16201a" stroke-width="2"/><polygon points="752,158 743,153 743,163" fill="#16201a"/>
  <text x="726.0" y="150" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">load</text>
  <line x1="882" y1="158" x2="927" y2="158" stroke="#16201a" stroke-width="2"/><polygon points="934,158 925,153 925,163" fill="#16201a"/>
  <text x="908.0" y="150" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">read</text>
  <line x1="1064" y1="158" x2="1109" y2="158" stroke="#16201a" stroke-width="2"/><polygon points="1116,158 1107,153 1107,163" fill="#16201a"/>
  <text x="1090.0" y="150" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#3b463f" text-anchor="middle">JSON</text>
  <rect x="558" y="330" width="154" height="112" rx="10" fill="#f4e2d9" stroke="#8f432a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="635.0" y="358" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Greenness features</text>
  <text x="635.0" y="380" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">HLS images are in S3</text>
  <text x="635.0" y="396" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">and counted; NDVI</text>
  <text x="635.0" y="412" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">not computed</text>
  <text x="635.0" y="430" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8f432a" text-anchor="middle">Not built</text>
  <rect x="740" y="330" width="154" height="112" rx="10" fill="#f4e2d9" stroke="#8f432a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="817.0" y="358" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">Marsden tables</text>
  <text x="817.0" y="380" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">figures are computed</text>
  <text x="817.0" y="396" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">in code, not yet</text>
  <text x="817.0" y="412" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">loaded here</text>
  <text x="817.0" y="430" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8f432a" text-anchor="middle">Not built</text>
  <rect x="922" y="330" width="154" height="112" rx="10" fill="#f4e2d9" stroke="#8f432a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="999.0" y="358" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16201a" text-anchor="middle">More endpoints</text>
  <text x="999.0" y="380" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">evidence, lineage,</text>
  <text x="999.0" y="396" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle">polygon upload</text>
  <text x="999.0" y="412" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3b463f" text-anchor="middle"></text>
  <text x="999.0" y="430" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8f432a" text-anchor="middle">Not built</text>
  <line x1="635.0" y1="330" x2="628.0" y2="250" stroke="#8f432a" stroke-width="2" stroke-dasharray="5 4"/><polygon points="635.0,250 626.0,245 626.0,255" fill="#8f432a"/>
  <polygon points="635.0,250 630.0,260 640.0,260" fill="#8f432a"/>
  <text x="643.0" y="292" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#8f432a" text-anchor="start">would feed</text>
  <rect x="24" y="462" width="1232" height="78" rx="10" fill="#faf9f4" stroke="#bdb9a6" stroke-width="1"/>
  <text x="44" y="488" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">At request time the app reads curated data only. No call to NASA or USDA is in the request path, so the demo cannot fail on a live service.</text>
  <text x="44" y="510" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">The decision engine is a pure function: the same field and the same answers always give the same result. It returns &quot;worth exploring&quot;, a comparison with caveats, or</text>
  <text x="44" y="528" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#16201a" text-anchor="start">&quot;not enough evidence&quot;. It never returns a score, a ranking or a winner.</text>
</svg>
