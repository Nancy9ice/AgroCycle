[project]
name = "agrocycle"
version = "0.1.0"
description = "AgroCycle: crop-rotation decision support for NASA Space Apps 2026"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "boto3",
    "clickhouse-connect",
    "geopandas",
    "pandas",
    "pandera[geopandas]",
    "pyarrow",
    "pyproj",
    "python-dotenv",
    "rasterio>=1.4.4",
    "shapely",
    "python-docx",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests", "transform", "engine", "api"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as `Depends(...)` in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]
